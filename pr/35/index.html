<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flagfall Arena Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="skin-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-first app. Play = status bar on top, the field, the unit bar, two rows of action icons pinned at the bottom.
   On wide screens the unit bar, actions, previews and unit list move to a column on the right of the field.
   Colours and fonts come from skin.js at start-up; these are fallbacks. */
:root {
  --paper: #e9ece6; --card: #f8f9f5; --ink: #1f2421; --muted: #5f6762; --line: #b8beb6; --hex: #fbfcf8; --stands: #d5dbd2;
  --north: #2f6b55; --northDark: #143a2c; --northLight: #8fd0b4; --northArc: #d3e3da; --northGoal: #a9cbbb;
  --south: #a8452f; --southDark: #5c2014; --southLight: #f0a48f; --southArc: #efd8cf; --southGoal: #dfb3a3;
  --flag: #b07a33; --keeper: #e2b53c; --gold: #e2b53c; --goldTint: #f9eeda; --brace: #1f4fd8; --move: #3f7fd6; --attack: #c62828; --select: #f2c94c;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button svg, .row svg { flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--brace); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.view { height: 100%; }
.view[hidden] { display: none !important; }
.scroll { height: 100%; overflow-y: auto; }
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.wide { max-width: 1100px; }
h1.title { margin: 0; font: 700 44px/0.95 var(--display); letter-spacing: .02em; text-transform: uppercase; }
h2 { font: 700 24px/1.05 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0; }
h3 { margin: 0 0 8px; font: 700 17px/1.1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin: 0; max-width: 75ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.btn { border: 1px solid var(--ink); background: var(--card); border-radius: 10px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--ink); color: var(--card); }
.btn.danger { border-color: var(--attack); color: var(--attack); background: #fff; }
.btn.go { background: var(--attack); border-color: var(--attack); color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.backbar { display: flex; align-items: center; gap: 10px; }
.iconbtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Home */
.menuitem { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); text-align: left; }
.menuitem.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
.menuitem .mt { display: block; font: 700 18px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
.menuitem .ms { display: block; font: 400 12px/1.35 var(--body); opacity: .8; margin-top: 3px; }

/* Settings and lineup */
.steps { display: flex; gap: 16px; align-items: center; }
.step { display: flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); color: var(--muted); }
.step i { width: 22px; height: 22px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; background: #d6dbd3; color: var(--ink); font-style: normal; font-size: 11px; }
.step.on { color: var(--ink); } .step.on i { background: var(--ink); color: var(--card); } .step.done i { background: var(--north); color: #fff; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label, .field .lab { font: 600 13px/1 var(--body); }
.hint { font: 400 12px/1.35 var(--body); color: var(--muted); }
.seg { display: flex; gap: 4px; padding: 4px; background: #dfe3dc; border-radius: 11px; }
.seg button { flex: 1 1 0; min-width: 0; height: 44px; border: 0; border-radius: 8px; background: transparent; font: 600 13px/1.1 var(--body); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.inp { height: 44px; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 0 12px; font: 500 14px/1 var(--body); color: var(--ink); width: 100%; }
.inp.mono { font: 600 15px/1 var(--mono); letter-spacing: .06em; }
.sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.side { display: flex; flex-direction: column; gap: 7px; padding: 12px; border-radius: 12px; background: var(--card); border: 2px solid var(--line); }
.side .nm { font: 700 15px/1 var(--display); letter-spacing: .08em; }
/* Teams: one side above the other, so the mix buttons and kit name get the full width; mix buttons wrap to two rows on narrow phones */
.sides.stack { grid-template-columns: minmax(0, 1fr); }
.seg.wrap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
.seg.wrap button { width: 100%; }
.side input[type=range] { accent-color: var(--muted); }
.counter { display: flex; flex-direction: column; gap: 6px; }
.pips { display: flex; gap: 3px; } .pips span { flex: 1; height: 8px; border-radius: 3px; background: #d6dbd3; } .pips span.on { background: var(--north); }
.keeper { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #fff; border: 2px solid var(--keeper); border-radius: 12px; }
.urow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.urow.on { border-color: var(--north); }
.urow .nm { font: 600 14px/1.1 var(--body); } .urow .st { font: 400 12px/1.2 var(--body); color: var(--muted); }
.step-btn { width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--ink); background: #fff; font: 600 20px/1 var(--body); }
.cnt { width: 22px; text-align: center; font: 600 18px/1 var(--mono); }
.footer { position: sticky; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); padding: 12px 20px 18px; display: flex; gap: 10px; }
.footer .btn { height: 52px; border-radius: 12px; }

/* Play */
#view-play { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-columns: minmax(0, 1fr); height: 100%; }
#topbar { grid-row: 1; position: relative; background: var(--ink); color: var(--card); display: flex; flex-direction: column; }
.tb-title { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0 16px; }
.tb-brand { font: 700 20px/1 var(--display); letter-spacing: .04em; color: var(--card); }
.tb-brand span { font-weight: 500; }
.tb-options { width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(248,249,245,.25); background: rgba(248,249,245,.08); color: var(--card); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.tb-rule { height: 1px; background: rgba(248,249,245,.15); margin: 8px 16px 0; }
.tb-board { position: relative; padding: 10px 16px 13px; display: flex; flex-direction: column; gap: 9px; }
.tb-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
.tb-name { display: flex; align-items: center; gap: 5px; min-width: 0; font: 700 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.tb-name > span:not([role]) { overflow: hidden; text-overflow: ellipsis; }
.tb-turn { display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1 var(--mono); color: var(--card); opacity: .8; }
.tb-phase { font: 600 11px/1 var(--body); letter-spacing: .1em; opacity: .75; }
.tb-end { display: flex; align-items: center; gap: 6px; font: 600 22px/1 var(--mono); }
.rope { position: relative; height: 10px; border-radius: 5px; }
.rope .knot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink); }
.dots { display: flex; gap: 3px; } .dots span { width: 6px; height: 6px; border-radius: 50%; }
.squares { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 220px; }
.squares span { width: 11px; height: 11px; border-radius: 2px; }
.underline { position: absolute; bottom: 0; width: 50%; height: 3px; }
#fieldwrap { grid-row: 2; position: relative; background: var(--stands); min-height: 0; overflow: hidden; }
#fieldscroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
#fieldscroll::-webkit-scrollbar { display: none; }
#board { display: block; width: 100%; max-width: 560px; margin: 0 auto; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
#board .cell { cursor: pointer; }
#board .unit { touch-action: none; }
.fade { position: absolute; left: 0; right: 0; height: 120px; pointer-events: none; transition: opacity .2s; }
.fade.top { top: 0; background: linear-gradient(to bottom, var(--stands) 25%, rgba(213,219,210,0)); }
.fade.bottom { bottom: 0; background: linear-gradient(to top, var(--stands) 25%, rgba(213,219,210,0)); }
.edge { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 14px; background: rgba(255,255,255,.94); box-shadow: 0 1px 4px rgba(0,0,0,.14); border: 0; min-height: 30px; }
.edge.top { top: 10px; } .edge.bottom { bottom: 10px; }
.edge[hidden] { display: none; }
#hint { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 5; background: var(--ink); color: var(--card); font: 600 13px/1.2 var(--body); padding: 8px 12px; border-radius: 10px; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#hint[hidden] { display: none; }
#namesbtn { position: absolute; top: 8px; right: 8px; background: rgba(248,249,245,.92); }
#unitbar { grid-row: 3; background: var(--card); border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 12px; min-height: 66px; }
.ub-name { font: 700 18px/1 var(--display); letter-spacing: .02em; }
.hpbar { width: 70px; height: 6px; border-radius: 3px; background: #dfe3dc; overflow: hidden; }
.hpbar i { display: block; height: 100%; }
.ub-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; margin-right: 4px; }
.ub-stat { display: inline-flex; align-items: center; gap: 4px; font: 600 13px/1 var(--mono); }
.sqs { display: inline-flex; gap: 2px; align-items: center; }
.sq { display: inline-block; width: 11px; height: 11px; border-radius: 2px; border: 1px solid var(--ink); background: #fff; }
.sq.on { background: var(--ink); } .sq.half { background: linear-gradient(to right, var(--ink) 50%, #fff 50%); } .sq.cost { background: var(--move); border-color: var(--move); } .sq.halfcost { background: linear-gradient(to right, var(--ink) 50%, var(--move) 50%); border-color: var(--move); }
.sq.w { width: 9px; height: 9px; border-color: #fff; background: transparent; }
.sq.w.on { background: #fff; } .sq.w.cost { background: rgba(255,255,255,.35); border-color: #fff; } .sq.w.half { background: linear-gradient(to right, #fff 50%, transparent 50%); } .sq.w.halfcost { background: linear-gradient(to right, #fff 50%, rgba(255,255,255,.35) 50%); border-color: #fff; }
.ub-info { flex-shrink: 0; width: 44px; height: 44px; margin-right: -8px; border: 0; background: none; display: flex; align-items: center; justify-content: center; padding: 0; }
.bench { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.bench button { min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--body); }
.bench button.on { border-color: var(--move); background: var(--move); color: #fff; }
#actions { grid-row: 4; background: var(--paper); border-top: 1px solid var(--line); padding: 8px 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.arow { display: flex; align-items: center; gap: 6px; }
.alabel { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 9px/1 var(--body); letter-spacing: .1em; color: var(--muted); }
.act { flex: 1 1 0; min-width: 0; height: 56px; border: 1px solid var(--ink); border-radius: 10px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; }
.act span { font: 600 11px/1 var(--body); }
.act.on { background: var(--move); border-color: var(--move); color: #fff; }
.act.primary { background: var(--ink); color: var(--card); }
.act.confirm { background: var(--attack); border-color: var(--attack); color: #fff; }
.act { position: relative; }
.act:disabled, .act[aria-disabled="true"] { opacity: .35; cursor: help; }
.act.reloading[aria-disabled="true"], .act.reloading:disabled { opacity: 1; border-color: rgba(31,36,33,.35); color: rgba(31,36,33,.35); }
.act .dot { position: absolute; top: 5px; right: 5px; width: 10px; height: 10px; border-radius: 50%; }
.act .dot.red { background: var(--attack); } .act .dot.blue { background: var(--brace); } .act .dot.ring { border: 2px solid var(--brace); }
.act.braced { border: 2px solid var(--brace); }
/* Specials (Brief 011): gold #e2b53c, tint #f9eeda, Bolt icon */
.act { position: relative; }
.act .spbar { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 5px; border-radius: 3px; background: rgba(226,181,60,.3); overflow: hidden; }
.act .spbar.half { background: linear-gradient(90deg, #e2b53c 50%, rgba(226,181,60,.3) 50%); }
.act .spbar.full { background: var(--ink); }
.act.sp-warm { border: 2px solid var(--gold); background: var(--goldTint); }
.act.sp-warm[aria-disabled="true"], .act.sp-warm:disabled { opacity: 1; }
.act.sp-charged { background: var(--gold); border: 2px solid var(--ink); color: var(--ink); }
.act.sp-charged.on { box-shadow: 0 0 0 3px var(--goldTint); }
.act.sp-used[aria-disabled="true"], .act.sp-used:disabled { opacity: .35; }
.act.go.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.sq.k { width: 9px; height: 9px; border-color: var(--ink); background: transparent; } .sq.k.on { background: var(--ink); } .sq.k.cost { background: transparent; border-color: rgba(31,36,33,.45); }
.warmline { display: flex; align-items: center; gap: 8px; padding: 6px 4px 8px; font: 500 13px/1.3 var(--body); color: var(--ink); }
.sp-extras { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 2px; }
.sp-extra { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sp-extra .fo-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-extra .fo-bar { width: 60px; flex: 0 0 60px; }
.sp-extra b { font: 600 14px/1 var(--mono); } .sp-extra b.kill { color: var(--attack); }
.uc-an.sp { font: 600 15px/1.2 var(--body); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spchip { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--body); padding: 3px 7px; border-radius: 10px; border: 1.5px solid var(--ink); color: var(--ink); }
.spchip.warm { border-color: var(--gold); color: #8a6a12; } .spchip.warm i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.spchip.used { border-color: var(--muted); color: var(--muted); }
.uc-note { font: 400 12px/1.35 var(--body); color: var(--muted); margin-top: 6px; }
.act.go { flex-direction: row; gap: 10px; background: var(--attack); border-color: var(--attack); color: #fff; }
.act.go .go-text { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.act.go .go-1 { font: 600 15px/1 var(--body); }
.act.go .go-2 { font: 500 11px/1 var(--body); opacity: .9; display: inline-flex; align-items: center; gap: 5px; }
#sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.18); padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 10px; max-height: 80%; overflow-y: auto; }
#sheet[hidden] { display: none; }
#scrim { position: absolute; inset: 0; background: rgba(31,36,33,.25); z-index: 7; }
#scrim[hidden] { display: none; }
#sheet.preview { border-radius: 14px 14px 0 0; border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,.12); padding: 10px 14px 12px; gap: 10px; max-height: calc(100% - 14px); overflow: hidden; }
#sheet.preview > * { flex-shrink: 0; }
#sheet.preview > .key { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.handle { align-self: center; width: 100%; height: 22px; margin: -8px 0 -6px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; touch-action: none; }
.handle span { width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
.key-hint { align-self: center; font: 500 11px/1 var(--body); color: var(--muted); margin-top: -6px; }
.key { display: flex; flex-direction: column; }
.key-h { font: 700 13px/1 var(--display); letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
.key-row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #eceee9; align-items: flex-start; }
.key-row svg { margin-top: 1px; }
.key-1 { font: 600 12px/1.3 var(--body); color: var(--ink); } .key-1.hurt { color: var(--attack); }
.key-2 { font: 400 11px/1.35 var(--body); color: var(--muted); }
.key-3 { font: 500 11px/1.35 var(--body); color: var(--ink); }
.fo { display: flex; gap: 6px; align-items: flex-start; }
.fo-side { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.fo-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.fo-side.right .fo-row { flex-direction: row-reverse; text-align: right; }
.fo-name { font: 700 13px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fo-hp { font: 600 11px/1 var(--mono); flex-shrink: 0; }
.fo-bar { flex: 1; height: 7px; border-radius: 3.5px; background: #dfe3dc; overflow: hidden; display: flex; }
.fo-bar i { display: block; height: 100%; }
.fo-stats { gap: 10px; flex-wrap: wrap; }
.fo-side.right .fo-stats { justify-content: flex-start; }
.fo-stat { display: inline-flex; align-items: center; gap: 3px; font: 600 12px/1 var(--mono); }
.fo-old { position: relative; color: var(--muted); }
.fo-old::after { content: ""; position: absolute; left: -1px; right: -1px; top: 50%; height: 1.5px; background: currentColor; transform: rotate(-28deg); }
.fo-new { margin-left: 3px; } .fo-new.hurt, .fo-num.hurt { color: var(--attack); }
.fo-mid { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 6px; font: 500 10px/1 var(--mono); color: var(--muted); }
.ob { display: flex; flex-direction: column; gap: 4px; }
.ob-row { display: grid; gap: 2px; text-align: center; }
.ob-p div { font: 500 10px/1 var(--mono); color: var(--muted); }
.ob-bar div { height: 10px; } .ob-bar div.first { border-radius: 3px 0 0 3px; } .ob-bar div.last { border-radius: 0 3px 3px 0; } .ob-bar div.first.last { border-radius: 3px; }
.ob-d div { font: 600 13px/1 var(--mono); color: var(--ink); } .ob-d div.kill { color: var(--attack); }
/* Unit card (in a match and on the Lineup screen) */
#sheet.card-sheet, .card-sheet { padding: 10px 16px 20px; gap: 14px; }
.card-sheet { display: flex; flex-direction: column; }
.uc-head { display: flex; align-items: center; gap: 10px; }
.uc-side { font: 700 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 3px; }
.uc-name { font: 700 22px/1.05 var(--display); }
.uc-type { font: 500 12px/1.3 var(--body); color: var(--muted); margin-top: 2px; }
.uc-status { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid; font: 600 12px/1 var(--body); }
.chip i { width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; }
.uc-stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.uc-stats div { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; }
.uc-stats div + div { border-left: 1px solid var(--line); }
.uc-stats b { font: 600 18px/1 var(--mono); } .uc-stats span { font: 600 10px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.uc-sec { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.uc-sh { font: 700 12px/1 var(--display); letter-spacing: .1em; color: var(--muted); }
.uc-sh span { font: 500 11px/1 var(--body); letter-spacing: 0; margin-left: 6px; }
.uc-an { font: 600 15px/1.25 var(--body); display: flex; align-items: center; gap: 6px; }
.uc-at { font: 400 13px/1.35 var(--body); color: var(--muted); }
.cost { font: 600 10px/1 var(--body); text-transform: uppercase; color: var(--south); border: 1px solid var(--south); border-radius: 4px; padding: 2px 4px; }
/* Options menu */
.menudim { position: fixed; inset: 0; background: rgba(31,36,33,.25); z-index: 16; }
.menu { position: fixed; top: 4px; right: 4px; width: 292px; max-width: calc(100vw - 8px); background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.3); padding: 4px 0 8px; z-index: 17; display: flex; flex-direction: column; }
.menudim[hidden], .menu[hidden], .lscrim[hidden], .lsheet[hidden] { display: none; }
.mh { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 0 8px 10px 16px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.mh-text { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; min-width: 0; }
.mh-1 { font: 600 14px/1.25 var(--body); } .mh-2 { font: 400 12px/1.3 var(--body); color: var(--muted); } .mh-3 { font: 500 11px/1.3 var(--mono); color: var(--muted); }
.mh-close { border-color: var(--line); background: var(--card); }
.mi { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 0; background: none; font: 600 14px/1.2 var(--body); text-align: left; width: 100%; }
.mi:hover { background: var(--paper); }
.mi.danger { color: var(--attack); }
.msep { height: 1px; background: var(--line); margin: 4px 0; }
/* Lineup rows and card */
.urows { display: flex; flex-direction: column; gap: 8px; }
.urow-open { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; min-height: 44px; }
.urow-open .nm, .urow-open .st { display: block; }
.stepper { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
.lscrim { position: fixed; inset: 0; background: rgba(31,36,33,.25); z-index: 12; }
.lsheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 13; max-height: 88%; display: flex; flex-direction: column; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.18); overflow: hidden; }
.lsheet .ls-body { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.ls-bar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 2px solid; padding: 12px 16px 18px; }
.ls-1 { font: 700 16px/1 var(--display); letter-spacing: .06em; } .ls-2 { font: 500 12px/1.3 var(--body); color: #36403b; margin-top: 3px; }
@media (min-width: 640px) { .lsheet { left: 50%; right: auto; width: 480px; transform: translateX(-50%); } }
.grab { align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
.calc { font: 500 13px/1.45 var(--mono); background: var(--paper); border-radius: 8px; padding: 8px 10px; }
.dice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; text-align: center; }
.dice div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; } .dice small { display: block; font: 500 11px/1 var(--body); color: var(--muted); } .dice b { font: 600 18px/1.3 var(--mono); }
.warn { margin: 0; font: 500 13px/1.4 var(--body); color: #8a1c1c; background: #fde7e7; border-radius: 8px; padding: 7px 10px; }
.ok { margin: 0; font: 500 13px/1.4 var(--body); background: var(--paper); border-radius: 8px; padding: 7px 10px; }
#side { display: none; }
.roster table { width: 100%; border-collapse: collapse; font-size: 13px; }
.roster th, .roster td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.roster th { font: 600 12px/1 var(--body); color: var(--muted); }
.roster tr.gone td { color: var(--muted); text-decoration: line-through; }
.roster .teamhead td { font: 700 14px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; padding-top: 10px; border-bottom: 2px solid currentColor; }
.recent { font: 12px/1.45 var(--mono); color: var(--muted); max-height: 220px; overflow: auto; }
.recent div { padding: 2px 0; border-bottom: 1px dotted var(--line); }
@media (min-width: 900px) {
  #view-play { grid-template-columns: minmax(0, 1fr) 390px; grid-template-rows: auto auto auto minmax(0, 1fr); }
  #topbar { grid-column: 1 / 3; }
  #topbar .tb-title, #topbar .tb-board { padding-left: max(16px, calc(50% - 360px)); padding-right: max(16px, calc(50% - 360px)); }
  #topbar .tb-rule { margin-left: max(16px, calc(50% - 360px)); margin-right: max(16px, calc(50% - 360px)); }
  #fieldwrap { grid-column: 1; grid-row: 2 / 5; }
  #unitbar { grid-column: 2; grid-row: 2; border-left: 1px solid var(--line); }
  #actions { grid-column: 2; grid-row: 3; border-left: 1px solid var(--line); }
  #side { display: flex; flex-direction: column; gap: 12px; grid-column: 2; grid-row: 4; overflow-y: auto; padding: 12px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
  /* Desktop (Brief 009 §7): the attack preview and the unit card sit in the right-hand column, 390 wide, over the roster. */
  #view-play > #sheet { position: relative; left: auto; right: auto; bottom: auto; grid-column: 2; grid-row: 4; z-index: 3; max-height: none; height: 100%; min-height: 0; overflow-y: auto; border-radius: 0; border-left: 1px solid var(--line); border-top: 1px solid var(--line); box-shadow: none; }
  #view-play > #sheet.preview { border-radius: 0; }
}
/* Data sheets */
.rsbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rsbar select, .rsbar input[type=text] { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-height: 40px; }
.dirty { color: var(--attack); font-weight: 600; font-size: 13px; }
.saved { color: var(--muted); font-size: 13px; }
.tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
table.data { border-collapse: collapse; font-size: 14px; min-width: 100%; }
table.data th, table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.data th { font: 600 12px/1.2 var(--body); color: var(--muted); background: var(--paper); }
table.data input[type=number] { width: 64px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
table.data input[type=text] { width: 70px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
table.data select { padding: 5px 4px; border: 1px solid var(--line); border-radius: 4px; background: #fff; max-width: 210px; }
table.data td.desc { white-space: normal; color: var(--muted); font-size: 13px; min-width: 240px; }
.formrow { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.formrow label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.formrow input, .formrow select { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-height: 40px; color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.fulllog { font: 12.5px/1.5 var(--mono); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 420px; overflow: auto; white-space: pre-wrap; }
.fulllog .t { font-weight: 600; color: var(--ink); margin-top: 6px; }
.copyarea { width: 100%; min-height: 120px; font: 12px/1.4 var(--mono); }

/* Covers, dialogs, toast */
.cover { position: fixed; inset: 0; background: var(--ink); color: var(--card); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 24px; }
.cover[hidden], .dialog[hidden] { display: none; }
.cover .box { max-width: 420px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.cover h2 { font-size: 34px; } .cover p { margin: 0; opacity: .85; }
.cover .btn { background: var(--card); color: var(--ink); border-color: var(--card); font-size: 17px; padding: 10px 18px; }
.dialog { position: fixed; inset: 0; background: rgba(31,36,33,.45); display: flex; align-items: center; justify-content: center; z-index: 15; padding: 20px; }
.dialog .box { background: #fff; border-radius: 16px; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 12px; max-width: 380px; width: 100%; box-shadow: 0 12px 32px rgba(0,0,0,.25); }
.dialog .btn { height: 48px; }
.toast { position: fixed; left: 50%; bottom: 200px; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: 90vw; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<section class="view" id="view-home"></section>
<section class="view" id="view-setup" hidden></section>
<section class="view" id="view-teams" hidden></section>

    <div id="scrim" hidden></div>
    <section id="sheet" hidden aria-live="polite"></section>
