# Full checks (Brief 003): the slow runs that are too long for every pull request.
# - every night at 08:07 UTC (3:07 AM New York in winter, 4:07 AM in summer: GitHub schedules in UTC only);
# - on demand: Actions tab → "night-checks" → "Run workflow";
# - on a pull request that carries the label `full checks`.
# A failing night or on-demand run opens (or adds to) a GitHub issue titled "Night checks failed".
# Brief 008: a night or on-demand run also files its result in results/: one INDEX line ("no change, passed") when main
# hasn't changed since the last passing night, otherwise a `nightly` run folder with a small health run. The lab
# (lab.yml) then plays whatever job orders are queued.
name: night-checks

on:
  schedule:
    - cron: "7 8 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: write        # Brief 008: the results pull request
  pull-requests: write
  issues: write
  actions: write         # start the checks on the results pull request

jobs:
  full:
    name: full checks
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full checks')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: test_v32.js (full double-knockout count, 400 + 400 games)
        id: v32
        continue-on-error: true
        working-directory: board
        run: node tests/test_v32.js 400
      - name: test_invariants.js (newest preset, 100 games)
        id: inv
        continue-on-error: true
        working-directory: board
        run: node tests/test_invariants.js 100
      - name: test_kitd.js (Kit D legal actions, 30 games per format)
        id: kitd
        continue-on-error: true
        working-directory: board
        run: node tests/test_kitd.js 30
      - name: test_brain5.js (Brain 5 legal play, 30 games per format and lineup)
        id: brain5
        continue-on-error: true
        working-directory: board
        run: node tests/test_brain5.js 30
      - name: test_brain6.js (Brain 6 legal play, 30 games per format and lineup)
        id: brain6
        continue-on-error: true
        working-directory: board
        run: node tests/test_brain6.js 30
      - name: test_brain7.js (Brain 7 legal play, 30 games per format and lineup)
        id: brain7
        continue-on-error: true
        working-directory: board
        run: node tests/test_brain7.js 30
      - name: test_brain8.js (Brain 8 legal play, 30 games per format and lineup)
        id: brain8
        continue-on-error: true
        working-directory: board
        run: node tests/test_brain8.js 30
      - name: Summary
        if: always()
        run: |
          mark() { [ "$1" = success ] && echo pass || echo "**FAIL** ($1)"; }
          { echo "## Full checks"; echo; echo "| Check | Result |"; echo "| --- | --- |"
            echo "| test_v32.js, 400 + 400 double-knockout count | $(mark "${{ steps.v32.outcome }}") |"
            echo "| test_invariants.js, 100 games on the newest preset | $(mark "${{ steps.inv.outcome }}") |"
            echo "| test_kitd.js, 30 games per format | $(mark "${{ steps.kitd.outcome }}") |"
            echo "| test_brain5.js, 30 games per format and lineup | $(mark "${{ steps.brain5.outcome }}") |"
            echo "| test_brain6.js, 30 games per format and lineup | $(mark "${{ steps.brain6.outcome }}") |"
            echo "| test_brain7.js, 30 games per format and lineup | $(mark "${{ steps.brain7.outcome }}") |"
            echo "| test_brain8.js, 30 games per format and lineup | $(mark "${{ steps.brain8.outcome }}") |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: File the night in results/ (Brief 008)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN || github.token }}
          SHA: ${{ github.sha }}
        run: |
          printf 'test_v32.js (400 + 400)=%s\ntest_invariants.js (100)=%s\ntest_kitd.js (30)=%s\ntest_brain5.js (30)=%s\n' "${{ steps.v32.outcome }}" "${{ steps.inv.outcome }}" "${{ steps.kitd.outcome }}" "${{ steps.brain5.outcome }}" > /tmp/checks.txt
          # the health run: the default brain against itself, 20 games per format, newest rule set
          node sims/lab/plan.js --orders "" --release /dev/null --release-only 1 --release-games 20 --out /tmp/nightly > /dev/null
          o=$(ls /tmp/nightly/*.json | head -1)
          node -e 'const f=process.argv[1],o=JSON.parse(require("fs").readFileSync(f));o.id="health";o.kind="nightly";o.question="Do main'"'"'s full checks still pass, and how do 20 games per format of the default brain against itself end?";o.tags=["nightly"];require("fs").writeFileSync(f,JSON.stringify(o))' "$o"
          mkdir -p /tmp/parts && node sims/lab/play.js --out /tmp/parts/p.jsonl "$o"
          node sims/lab/nightly.js --commit "$SHA" --checks /tmp/checks.txt --parts /tmp/parts --order "$o"
          bash sims/lab/deliver.sh main "Night checks $(date -u +%Y-%m-%d)"
      - name: Open an issue if a night or on-demand run failed
        if: (steps.v32.outcome != 'success' || steps.inv.outcome != 'success' || steps.kitd.outcome != 'success' || steps.brain5.outcome != 'success' || steps.brain6.outcome != 'success' || steps.brain7.outcome != 'success' || steps.brain8.outcome != 'success') && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The full checks failed on \`main\` ($(date -u +%Y-%m-%d)). Run: $RUN

          - test_v32.js (400 + 400 double-knockout count): ${{ steps.v32.outcome }}
          - test_invariants.js (100 games): ${{ steps.inv.outcome }}
          - test_kitd.js (30 games per format): ${{ steps.kitd.outcome }}
          - test_brain5.js (30 games per format and lineup): ${{ steps.brain5.outcome }}
          - test_brain6.js (30 games per format and lineup): ${{ steps.brain6.outcome }}
          - test_brain7.js (30 games per format and lineup): ${{ steps.brain7.outcome }}
          - test_brain8.js (30 games per format and lineup): ${{ steps.brain8.outcome }}

          Opened automatically by the night-checks workflow (Brief 003). Close it once a fix is merged."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Night checks failed"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "Night checks failed" --body "$body"; fi
      - name: Fail the run if a check failed
        if: steps.v32.outcome != 'success' || steps.inv.outcome != 'success' || steps.kitd.outcome != 'success' || steps.brain5.outcome != 'success' || steps.brain6.outcome != 'success' || steps.brain7.outcome != 'success' || steps.brain8.outcome != 'success'
        run: exit 1
