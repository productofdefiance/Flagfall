# waits-on (Brief 031, amendments 8 and 10): a pull request can't merge while a brief it waits on hasn't merged, or
# has merged but isn't in the branch yet ("028 merged: sync once to test on it").
# One script (tools/waits-on.js) reads main live and posts the commit status `waits-on` on every open pull request,
# results (lab/*) and docs pull requests included (they pass): on pull request events, on every push to main and
# hourly, so no pull request is ever left without it.
# To make it block merging, the Editor ticks it once, only after every open pull request shows it: Settings → Rules →
# Rulesets → the rule for main → Require status checks to pass → Add checks → `waits-on` → Save changes.
name: waits-on

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: read

concurrency:
  group: waits-on
  cancel-in-progress: false

jobs:
  set:
    # Not named `waits-on`: the required check is the commit status this job sets on every open pull request.
    name: set the waits-on status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # main's script reads main live, whatever started the run
          fetch-depth: 0
          filter: blob:none
      # Only before Brief 031 is on main: take the script from the pull request that adds it.
      - name: Script not on main yet (Brief 031's own pull request)
        if: hashFiles('tools/waits-on.js') == '' && github.event_name == 'pull_request'
        run: |
          git fetch -q --filter=blob:none origin "${{ github.event.pull_request.head.sha }}"
          git checkout -q "${{ github.event.pull_request.head.sha }}" -- tools
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Set waits-on on every open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/waits-on.js --all | tee -a "$GITHUB_STEP_SUMMARY"
