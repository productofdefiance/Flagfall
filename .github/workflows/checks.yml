# Quick checks on every pull request and every push to main (Brief 001, split in Brief 003).
# The slow checks (the full 400 + 400 double-knockout count) run at night instead: see night-checks.yml.
# The jobs run side by side; the last job is named `checks` and is the one the protection rule on main requires.
# Brief 031 (amendments 3 and 9): the tests come from one generated list (tools/run-tests.js reads each test file's
# `@test` line), so no step or name per test is kept here and two builds that add tests never collide in this file.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  # Brief 008: the lab starts the checks on its own results pull requests when it has only the workflow's own token (a
  # pull request opened by that token starts no workflows by itself). Brief 027: with the Editor's key (LAB_TOKEN) the
  # pull request's own run is the only one (sims/lab/lab_key.sh).
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # Brief 031 (amendment 11, M6): a failing run on main opens a "Main broken" issue

jobs:
  # Brief 031: a docs-only pull request (only briefs/, flags/ or .md files outside board/ and sims/) skips the game
  # jobs below. The `checks` job still runs and reports, so the required check is never skipped.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.c.outputs.docs_only }}
      screen_only: ${{ steps.c.outputs.screen_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; echo "screen_only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE"...HEAD > changed.txt
          node -e 'const R=require("./sims/lab/release_files.js"),f=require("fs").readFileSync("changed.txt","utf8").split("\n").filter(Boolean),c=R.classify(f);
            const docs=R.docsOnly(f), screen=c.screen.length>0&&!c.game.length&&!c.other.length;
            console.log(`docs_only=${docs}\nscreen_only=${screen}`)' | tee -a "$GITHUB_OUTPUT"

  tests:
    name: tests (${{ matrix.job }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        job: [rules, slow, brains, invariants, board]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # The board reads the counted version (main's number, or "<version>+NNN" on a pull request).
      - name: Stamp the version
        env:
          PR: ${{ github.event.pull_request.number }}
        run: if [ -n "$PR" ]; then node tools/stamp-version.js --pr --pr-number "$PR"; else node tools/stamp-version.js; fi
      - name: Install a headless browser (Playwright)
        if: matrix.job == 'board'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      # Review F2: the list itself, once per run: every test file has a @test line, a known job and at least one level.
      - name: Check the test list
        if: matrix.job == 'rules'
        run: node tools/run-tests.js --check
      - name: Run the ${{ matrix.job }} tests from the generated list
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node tools/run-tests.js --level quick --job ${{ matrix.job }}

  compare:
    name: version check and replay hashes
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Find the commit to compare against
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          sha="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$sha" ] || [ "$sha" = "0000000000000000000000000000000000000000" ]; then echo "sha=" >> "$GITHUB_OUTPUT"; else echo "sha=$sha" >> "$GITHUB_OUTPUT"; fi
      - name: Check out the earlier commit
        if: steps.base.outputs.sha != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base-commit
      # Brief 031 (replaces check-build-number.sh): no number in the pull request; it adds releases/NNN.json matching its
      # brief, releases/ is append-only, and board/version.js stays null. The number is counted at merge.
      - name: Version check (releases/NNN.json, no number in version.js)
        id: build
        shell: bash   # bash with pipefail, so a failing check is not hidden by tee
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "${{ steps.base.outputs.sha }}" ]; then echo "No earlier commit to compare against." | tee build-number.txt; exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/check-release.js --base "${{ steps.base.outputs.sha }}" --title "$TITLE" --head-ref "$HEAD_REF" | tee build-number.txt
          else
            node tools/check-release.js --base "${{ steps.base.outputs.sha }}" --push | tee build-number.txt
          fi
      # Report only for a build that changes a game file (a rule change is meant to change one rule set's hash).
      # Brief 031: must pass for a screen-only build (app.js, ui.js, skin.js, index.html): every preset, the newest
      # included, must replay exactly as on its base, since it gets no release run.
      - name: Replay regression hashes
        id: regress
        continue-on-error: ${{ needs.changes.outputs.screen_only != 'true' }}
        env:
          SCREEN_ONLY: ${{ needs.changes.outputs.screen_only }}
        run: |
          # every preset and every brain, 1 game each (3 games of `all` take about 15 minutes a board)
          n=3; all=""; [ "$SCREEN_ONLY" = "true" ] && { n=1; all="all"; }
          if [ -f base-commit/board/engine.js ]; then node board/tests/regress_engine.js base-commit/board $n $all | tee regress-base.txt; fi
          node board/tests/regress_engine.js board $n $all | tee regress-head.txt
          if [ "$SCREEN_ONLY" = "true" ] && [ -f regress-base.txt ]; then
            if diff <(grep -v '^#' regress-base.txt) <(grep -v '^#' regress-head.txt); then echo "Screen-only build: every preset replays exactly as on its base."
            else echo "FAIL: a screen-only build changed how games replay (hashes above differ). It would need a release run: change a game file's classification or fix the leak."; exit 1; fi
          fi
      - name: Summary
        if: always()
        run: |
          { echo "## Version check"; echo; echo '```'; cat build-number.txt 2>/dev/null; echo '```'
            echo "## Replay regression hashes (must match for a screen-only build; report only otherwise)"; echo
            echo "A rule change is meant to change one rule set's hash. Every other rule set should print the same hash."; echo
            if [ -f regress-base.txt ]; then echo "**Earlier commit** \`${{ steps.base.outputs.sha }}\`"; echo '```'; cat regress-base.txt; echo '```'; else echo "No earlier board to compare against."; fi
            if [ -f regress-head.txt ]; then echo "**This commit**"; echo '```'; cat regress-head.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The protection rule on main requires this job. It always runs (a skipped required check would count as passed)
  # and fails unless every job above passed.
  checks:
    name: checks
    if: always()
    needs: [changes, tests, compare]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All quick checks passed
        env:
          TESTS: ${{ needs.tests.result }}
          CMP: ${{ needs.compare.result }}
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.changes.outputs.docs_only }}
        run: |
          mark() { [ "$1" = success ] && echo pass || echo "**FAIL** ($1)"; }
          # Brief 031: a docs-only pull request skips the game jobs; this job still reports, so the check is never skipped.
          if [ "$CHANGES" = success ] && [ "$DOCS" = true ]; then
            { echo "## Quick checks"; echo; echo "Docs-only pull request (briefs/, flags/ or .md files outside board/ and sims/): the game jobs were skipped."; } >> "$GITHUB_STEP_SUMMARY"
            echo "Docs only: nothing to check."; exit 0
          fi
          [ "$CHANGES" = success ] || { echo "Could not tell what changed."; exit 1; }
          { echo "## Quick checks"; echo; echo "| Job | Result |"; echo "| --- | --- |"
            echo "| Tests from the generated list (rules, slow, brains, invariants, board) | $(mark "$TESTS") |"
            echo "| Version check (releases/NNN.json, no number in version.js) and replay hashes | $(mark "$CMP") |"
            echo; echo "The full counts run every night (night-checks)."
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$TESTS" "$CMP"; do [ "$r" = success ] || { echo "A quick check failed: see the jobs above."; exit 1; }; done
          echo "All quick checks passed."

  # Brief 031 (amendment 11, M6): main is tested as merged only after the merge, so a failing run on main raises the
  # alarm: an issue "Main broken" (the status board shows "main broken since <brief>"), closed again when main passes.
  alarm:
    name: main broken alarm
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open, add to or close the Main broken issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.checks.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Main broken"' --json number --jq '.[0].number')
          if [ "$RESULT" = success ]; then
            [ -z "$n" ] || gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "main passes its checks again at ${SHA::7} ($RUN)."
            exit 0
          fi
          body="The checks failed on \`main\` at ${SHA::7}: $RUN. Opened automatically by the checks workflow (Brief 031); it closes itself when main passes again."
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "Main broken" --body "$body"; fi
