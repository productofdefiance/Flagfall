# The lab (Brief 008): plays simulation job orders on GitHub instead of in a Claude session, and files every result
# in results/ (see results/README.md).
# - every night, after main's night checks: whatever is queued in studies/queue/;
# - on demand: Actions tab → "lab" → "Run workflow" (optionally naming the job orders to play);
# - on a pull request that adds a job order: plays it and commits the run folder to that pull request;
# - on a pull request that changes a game file (sims/lab/release_files.js), or whose replay hashes differ from its base:
#   a `release` run (the version's final exam), posted as a comment; after the merge it runs again on main (same seeds,
#   same games) and is filed under the version the build actually got (Brief 031). A screen-only build gets no release
#   run; on main its version gets one index line, "same games as <last version with a release run>" (sims/lab/same.js).
# Every job stamps board/version.js straight after checkout (tools/stamp-version.js): main's counted number, or a pull
# request's label "<main's version>+NNN". The stamp is never committed (deliver.sh adds only results/ and studies/).
# Results reach main through an automatic pull request that may only change results/ and studies/ and merges itself
# once the checks pass (sims/lab/deliver.sh).
name: lab

on:
  workflow_run:
    workflows: [night-checks]
    types: [completed]
    branches: [main]   # only main's night checks: a pull request's night-checks run must not start (and queue-jump) a lab run
  workflow_dispatch:
    inputs:
      orders:
        description: "Job orders to play (paths, space-separated). Leave empty to play everything in studies/queue/."
        required: false
        default: ""
      rush:
        description: "Take every machine now, even in the daytime (Brief 024)."
        type: boolean
        required: false
        default: false
  pull_request:
    paths: ["studies/queue/**", "board/**", "sims/lab/**"]
  push:
    branches: [main]
    paths: ["board/**", "releases/**", "studies/queue/**"]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# Brief 024: a new push to a pull request cancels its lab run for the older commit (queued or playing) and plays the
# new one. Runs on main (the nightly chain, releases after a merge, hand starts) are never cancelled this way.
concurrency:
  group: lab-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE: https://productofdefiance.github.io/Flagfall/

jobs:
  plan:
    name: plan
    # After night checks: only the scheduled (or hand-started) run on main, not a labelled pull request's.
    # Brief 027: never on a results-only pull request (head branch lab/**): its moved job orders touch studies/queue/,
    # but there is nothing to play. Every other job needs this one, so the whole run is skipped.
    if: (github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'main')) && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'lab/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      orders: ${{ steps.plan.outputs.orders }}
      parts: ${{ steps.plan.outputs.parts }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      release: ${{ steps.plan.outputs.release }}
      key: ${{ steps.rel.outputs.key }}
      same: ${{ steps.rel.outputs.same }}
      more: ${{ steps.rel.outputs.more }}
      game: ${{ steps.stamp.outputs.game }}
      build: ${{ steps.stamp.outputs.build }}
      date: ${{ steps.stamp.outputs.date }}
      site: ${{ steps.where.outputs.site }}
      trigger: ${{ steps.where.outputs.trigger }}
      started: ${{ steps.where.outputs.started }}
      sha: ${{ steps.sha.outputs.sha }}
      max_parallel: ${{ steps.share.outputs.max_parallel || 2 }}
      release_parallel: ${{ steps.share.outputs.release_parallel || 1 }}
      matrix_w1: ${{ steps.share.outputs.matrix_w1 }}
      matrix_w2: ${{ steps.share.outputs.matrix_w2 }}
      has_w2: ${{ steps.share.outputs.has_w2 }}
      share_line: ${{ steps.share.outputs.line }}
      share: ${{ steps.share.outputs.share }}
      checks_waiting: ${{ steps.share.outputs.checks_waiting }}
      games: ${{ steps.plan.outputs.games }}
    steps:
      # A pull request's branch as it is when this run starts, not the commit that queued it: a run that waited behind
      # another sees the job orders that one already played (moved to studies/done) and doesn't play them again.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || (github.event_name == 'workflow_run' && 'main') || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # Brief 031 (amendment 2, B2): what this run must play. A pull request: from the whole pull request against its
      # merge-base, every run, by the game key (skipped only when a finished run with that key was posted here). main:
      # every version since the baseline with neither a release run nor a "same games as" line; the oldest that needs
      # one is played at its own commit, the ones whose games are the same get their line, and if more are left the
      # lab starts itself again.
      - name: Release decision
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch -q --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main || true
          if [ -n "$PR" ]; then node sims/lab/release_files.js --plan --pr "$PR" --main origin/main; else node sims/lab/release_files.js --plan; fi
      # Amendment 5 (H3): one stamp per version played, at the commit played; every later job gets it from here.
      - name: Go to the commit this run plays, and stamp it
        id: stamp
        env:
          PR: ${{ github.event.pull_request.number }}
          TARGET: ${{ steps.rel.outputs.sha }}
          TGAME: ${{ steps.rel.outputs.target_game }}
          TBUILD: ${{ steps.rel.outputs.target_build }}
          TDATE: ${{ steps.rel.outputs.target_date }}
        run: |
          [ "$(git rev-parse HEAD)" = "$TARGET" ] || git checkout -q --detach "$TARGET"
          if [ -n "$PR" ]; then node tools/stamp-version.js --pr --pr-number "$PR" --github-output
          elif [ -n "$TGAME" ]; then node tools/stamp-version.js --set "$TGAME" --build "$TBUILD" --date "$TDATE" --github-output
          else node tools/stamp-version.js --github-output; fi
      - name: The commit this run plays
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Where the results and replay links go
        id: where
        env:
          EV: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # A pull request's replay links open its own preview board (the play-links workflow publishes it).
          if [ "$EV" = "pull_request" ]; then echo "site=${SITE}pr/$PR/" >> "$GITHUB_OUTPUT"; echo "trigger=pull request" >> "$GITHUB_OUTPUT";
          elif [ "$EV" = "workflow_run" ]; then echo "site=$SITE" >> "$GITHUB_OUTPUT"; echo "trigger=night" >> "$GITHUB_OUTPUT";
          else echo "site=$SITE" >> "$GITHUB_OUTPUT"; echo "trigger=day" >> "$GITHUB_OUTPUT"; fi
      - name: Plan
        id: plan
        env:
          EV: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ORDERS: ${{ github.event.inputs.orders }}
          RELEASE: ${{ steps.rel.outputs.release }}
          KEY: ${{ steps.rel.outputs.key }}
          WHY: ${{ steps.rel.outputs.why }}
          TGAME: ${{ steps.rel.outputs.target_game }}
        run: |
          rel=""; [ "$RELEASE" = "true" ] && rel="--release 1 --release-key $KEY"
          if [ "$EV" = "pull_request" ] || [ "$EV" = "push" ]; then
            # only the job orders this pull request (or push) adds or changes
            ORDERS=""
            if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then ORDERS=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'studies/queue/*.json' | tr '\n' ' '); fi
          fi
          only=""
          # A missed version played at its own (older) commit: queued orders wait for the next run (it starts itself).
          if [ -n "$TGAME" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then ORDERS=""; only="--release-only 1"; fi
          if { [ "$EV" = "pull_request" ] || [ "$EV" = "push" ]; } && [ -z "$ORDERS" ]; then only="--release-only 1"; fi
          node sims/lab/plan.js --orders "$ORDERS" $rel --release-why "$WHY" $only
      # Brief 024: how many machines this run takes, from what started it, how big it is and how busy the repository
      # is (numbers in sims/lab/capacity.json). Big daytime runs play in two waves; the second wave chooses again.
      - name: Share of machines
        id: share
        if: steps.plan.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EV: ${{ github.event_name }}
          RUSH: ${{ github.event.inputs.rush }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR: ${{ github.event.pull_request.number }}
          ORDERS: ${{ steps.plan.outputs.orders }}
          PARTS: ${{ steps.plan.outputs.parts }}
          RELEASE: ${{ steps.plan.outputs.release }}
        run: node sims/lab/capacity.js --event "$EV" --orders "$ORDERS" --parts "$PARTS" --release "$RELEASE" --rush "${RUSH:-false}" --labels "$LABELS" --pr "$PR"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.has_work == 'true'
        with:
          name: orders
          path: studies/queue/
          retention-days: 90

  play:
    name: play part ${{ matrix.part }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_w1) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Stamp the version the plan worked out (Brief 031, H3)
        run: node tools/stamp-version.js --set "${{ needs.plan.outputs.game }}" --build "${{ needs.plan.outputs.build }}" --date "${{ needs.plan.outputs.date }}"
      - uses: actions/download-artifact@v4
        with:
          name: orders
          path: studies/queue/
      - name: Play this part
        run: node sims/lab/play.js --part ${{ matrix.part }} --parts ${{ needs.plan.outputs.parts }} --site "${{ needs.plan.outputs.site }}" --out parts/part-${{ matrix.part }}.jsonl ${{ needs.plan.outputs.orders }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: parts/
          retention-days: 90

  # Brief 024: the second wave of a big daytime run. Its share is chosen afresh when the first wave ends, so it gives
  # way if builds arrived meanwhile and speeds up if night fell. The parts are the same as in one pass: same games.
  wave2:
    name: second wave share
    needs: [plan, play]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_w2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      max_parallel: ${{ steps.share.outputs.max_parallel || 2 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: orders
          path: studies/queue/
      - name: Share of machines (second wave)
        id: share
        env:
          GH_TOKEN: ${{ github.token }}
          EV: ${{ github.event_name }}
          RUSH: ${{ github.event.inputs.rush }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR: ${{ github.event.pull_request.number }}
          ORDERS: ${{ needs.plan.outputs.orders }}
          PARTS: ${{ needs.plan.outputs.parts }}
        run: node sims/lab/capacity.js --wave 2 --event "$EV" --orders "$ORDERS" --parts "$PARTS" --release false --rush "${RUSH:-false}" --labels "$LABELS" --pr "$PR"

  play2:
    name: play part ${{ matrix.part }}
    needs: [plan, wave2]
    if: ${{ !cancelled() && needs.wave2.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.wave2.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_w2) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Stamp the version the plan worked out (Brief 031, H3)
        run: node tools/stamp-version.js --set "${{ needs.plan.outputs.game }}" --build "${{ needs.plan.outputs.build }}" --date "${{ needs.plan.outputs.date }}"
      - uses: actions/download-artifact@v4
        with:
          name: orders
          path: studies/queue/
      - name: Play this part
        run: node sims/lab/play.js --part ${{ matrix.part }} --parts ${{ needs.plan.outputs.parts }} --site "${{ needs.plan.outputs.site }}" --out parts/part-${{ matrix.part }}.jsonl ${{ needs.plan.outputs.orders }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: parts/
          retention-days: 90

  # Release runs also run every check in README.md (full counts) and the regression hashes, for the summary.
  # Brief 027 (F024-1): the quick checks share one machine, one after another; only the slow ones get their own
  # (test_v32.js at 400 + 400, test_invariants.js at 100, the other brains at 30, the hashes): 16 jobs became 5. Each
  # check still writes its own name=outcome line, so tables/checks.csv lists every check by name as before.
  release-checks:
    name: release check ${{ matrix.check.name }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Brief 031 (amendment 9): the same generated test list as `checks` and night checks (tools/run-tests.js), at
    # each test's release count, one machine per group, plus the replay hashes of every preset, the newest included.
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.release_parallel) }}
      matrix:
        check:
          - { name: "rules", cmd: "rules" }
          - { name: "slow", cmd: "slow" }
          - { name: "brains", cmd: "brains" }
          - { name: "invariants", cmd: "invariants" }
          - { name: "board", cmd: "board" }
          - { name: "regression hashes", cmd: "hashes" }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Stamp the version the plan worked out (Brief 031, H3)
        run: node tools/stamp-version.js --set "${{ needs.plan.outputs.game }}" --build "${{ needs.plan.outputs.build }}" --date "${{ needs.plan.outputs.date }}"
      - name: Install a headless browser (Playwright)
        if: matrix.check.cmd == 'board'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      - name: ${{ matrix.check.name }}
        env:
          NAME: ${{ matrix.check.name }}
          CMD: ${{ matrix.check.cmd }}
          EV: ${{ github.event_name }}
          NODE_PATH: /tmp/pw/node_modules
        run: |
          mkdir -p out
          if [ "$CMD" = "hashes" ]; then
            # Against the board this version started from: the merge-base with main (a pull request), or the commit
            # before it (a version on main). Every preset, the newest included (regress_engine.js ... all).
            git fetch -q --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main || true
            if [ "$EV" = "pull_request" ]; then BASE=$(git merge-base origin/main HEAD); else BASE=$(git rev-parse HEAD^1); fi
            : > out/hashes.txt
            mkdir -p /tmp/base && git archive "$BASE" board | tar -x -C /tmp/base
            echo "Earlier board ($BASE):" >> out/hashes.txt; node board/tests/regress_engine.js /tmp/base/board 3 all >> out/hashes.txt
            echo "This board:" >> out/hashes.txt
            if node board/tests/regress_engine.js board 3 all >> out/hashes.txt; then echo "$NAME=success" > out/check-hashes.txt; else echo "$NAME=failure" > out/check-hashes.txt; fi
          else
            node tools/run-tests.js --level release --job "$CMD" --out out || true   # each test writes its own name=outcome
            ls out/check-*.txt > /dev/null 2>&1 || echo "$NAME (no test ran)=failure" > out/check-none-$CMD.txt
          fi
          cat out/check-*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ strategy.job-index }}
          path: out/

  # Brief 031 (amendment 2): versions on main whose games are the same as a filed release run (same game key, no new
  # rules or brain) get one results index line, "same games as <that version>", so every version points to its numbers.
  same:
    name: same games as a filed release
    needs: plan
    if: needs.plan.outputs.same != '' && needs.plan.outputs.same != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.LAB_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: File the lines
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN || github.token }}
          SAME: ${{ needs.plan.outputs.same }}
        run: |
          node sims/lab/same.js --list "$SAME" | tee -a "$GITHUB_STEP_SUMMARY"
          bash sims/lab/deliver.sh main "Lab: same games as a filed release ($(date -u +%Y-%m-%d))"

  merge:
    name: merge and file the results
    needs: [plan, play, wave2, play2, release-checks]
    if: always() && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # a pull request's own branch, so the run folder can be committed to it
          ref: ${{ github.event.pull_request.head.ref || 'main' }}
          token: ${{ secrets.LAB_TOKEN || github.token }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # The version of the commit that was played (main may have moved on since the plan): never re-read main's tip.
      - name: Stamp the version the plan worked out (Brief 031, H3)
        run: node tools/stamp-version.js --set "${{ needs.plan.outputs.game }}" --build "${{ needs.plan.outputs.build }}" --date "${{ needs.plan.outputs.date }}"
      - uses: actions/download-artifact@v4
        with:
          name: orders
          path: studies/queue/
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts/
          merge-multiple: true
        continue-on-error: true
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.release == 'true'
        with:
          pattern: release-check-*
          path: release/
          merge-multiple: true
        continue-on-error: true
      - name: Gather the release checks
        if: needs.plan.outputs.release == 'true'
        run: |
          mkdir -p release; cat release/check-*.txt > release/checks.txt 2>/dev/null || true
          [ -f release/hashes.txt ] || : > release/hashes.txt
          cat release/checks.txt
      - name: Merge
        id: merge
        env:
          EV: ${{ github.event_name }}
          # both waves: a skipped second wave (one-go runs) counts as done
          PLAY: ${{ (needs.play.result == 'success' && (needs.play2.result == 'success' || needs.play2.result == 'skipped')) && 'success' || format('{0}/{1}', needs.play.result, needs.play2.result) }}
          COMMIT: ${{ needs.plan.outputs.sha }}
          TRIGGER: ${{ needs.plan.outputs.trigger }}
          ORDERS: ${{ needs.plan.outputs.orders }}
          STARTED: ${{ needs.plan.outputs.started }}
        run: |
          failed=""; [ "$PLAY" = "success" ] || failed="some machines failed while playing (play: $PLAY); the totals cover only the parts that finished"
          extra=""; [ -f release/checks.txt ] && extra="--checks release/checks.txt --hashes release/hashes.txt"
          rel=""; other=""
          for o in $ORDERS; do case "$(basename "$o")" in release-*) rel="$rel $o";; *) other="$other $o";; esac; done
          # A release on a pull request is only posted as a comment: it is filed after the merge, when it runs again on
          # main with the same seeds. Everything else is filed in results/.
          if [ "$EV" = "pull_request" ] && [ -n "$rel" ]; then
            mkdir -p /tmp/release-results
            node sims/lab/merge.js --results /tmp/release-results --parts parts --trigger "$TRIGGER" --commit "$COMMIT" --started "$STARTED" ${failed:+--failed "$failed"} $extra $rel > release-written.txt
            rm -f $rel
          else other="$other $rel"; fi
          : > written.txt
          if [ -n "$(echo $other)" ]; then
            node sims/lab/merge.js --results results --parts parts --trigger "$TRIGGER" --commit "$COMMIT" --started "$STARTED" --move studies/done ${failed:+--failed "$failed"} $extra $other | tee written.txt
          fi
          [ -z "$failed" ] || echo "failed=true" >> "$GITHUB_OUTPUT"
          { echo "## Lab run"; for d in $(cat written.txt release-written.txt 2>/dev/null); do echo; cat "$d/SUMMARY.md"; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: run-folders
          path: |
            results/
            /tmp/release-results/
          retention-days: 90
      - name: Post the release summary on the pull request
        if: github.event_name == 'pull_request' && needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          KEY: ${{ needs.plan.outputs.key }}
          FAILED: ${{ steps.merge.outputs.failed }}
        run: |
          d=$(head -1 release-written.txt)
          { echo "**Release run for this version.** It is filed under \`results/\` after the merge, when it runs again on \`main\` with the same seeds (the same games)."; echo; cat "$d/SUMMARY.md"
            # Brief 031 (B2): the game key of a finished run, so a later push with the same game doesn't play it again.
            # A run whose machines failed carries no key, so the next push plays it again.
            if [ "$FAILED" != "true" ]; then echo; echo "<!-- release-key: $KEY -->"; fi
          } > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
      - name: Deliver to the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN || github.token }}
        run: |
          bash sims/lab/deliver.sh branch "Lab - results for this pull request's job orders" "${{ github.event.pull_request.head.ref }}"
      - name: Deliver to main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN || github.token }}
        run: |
          bash sims/lab/deliver.sh main "Lab results, $(date -u +%Y-%m-%d) (${{ needs.plan.outputs.trigger }})"
      # Brief 031 (B2): more versions on main still lack a release run: start the lab again (one waiting run per group
      # means a merge's own run can be dropped; this catches up).
      - name: Start the lab again for the next missed version
        if: github.event_name != 'pull_request' && needs.plan.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lab.yml --repo "$GITHUB_REPOSITORY" --ref main
      # Brief 024: one line per run in the queue log, on the status branch (not the results pull request, where two
      # runs appending to one file would conflict): the data for tuning the share rules.
      - name: Queue log
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EV: ${{ github.event_name }}
          GAMES: ${{ needs.plan.outputs.games }}
          SHARE: ${{ needs.plan.outputs.share }}
          LINE: ${{ needs.plan.outputs.share_line }}
          CHECKS: ${{ needs.plan.outputs.checks_waiting }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          row=$(node sims/lab/queuelog.js --run "$GITHUB_RUN_ID" --event "$EV" --games "$GAMES" --share "$SHARE" --why "$LINE" --checks "$CHECKS")
          echo "$row"; echo "Queue log: $row" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5; do
            rm -rf ql && git init -q ql && cd ql
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "$REPO_URL"
            git fetch -q --depth 1 origin status || { echo "No status branch yet: queue log skipped."; exit 0; }
            git checkout -q -B status FETCH_HEAD
            mkdir -p queue; [ -f queue/queue-log.csv ] || node ../sims/lab/queuelog.js --header > queue/queue-log.csv
            echo "$row" >> queue/queue-log.csv
            git add queue/queue-log.csv && git commit -q -m "Queue log: lab run $GITHUB_RUN_ID"
            if git push -q origin status; then exit 0; fi
            cd ..; sleep $((i * 4))
          done
      - name: Open an issue if the run failed
        if: (failure() || steps.merge.outputs.failed == 'true') && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="A lab run failed ($(date -u +%Y-%m-%d)). Run: $RUN. Its run folder (if one was written) says what failed in SUMMARY.md. Opened automatically by the lab workflow (Brief 008)."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Lab run failed"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "Lab run failed" --body "$body"; fi
