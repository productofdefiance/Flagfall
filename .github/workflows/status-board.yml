# Status board (Brief 021): one small board for the Editor, kept current by GitHub, never by a chat.
# - BOARD.md and board.json go to the `status` branch (with the design chats' log in chats/). Nothing on main is ever
#   written by this workflow.
# - The same board is published as a page: https://productofdefiance.github.io/Flagfall/status/ (gh-pages, status/).
# Runs on pull request events, pushes to main and brief/**, when checks / night-checks / lab finish, every hour (a
# results pull request merged by auto-merge starts no workflows), and on demand (Actions tab → status board → Run).
# A push to `status` (a chat writing its log file) can't start it: GitHub reads a push's workflows from the pushed
# branch, and `status` holds no workflows. The hourly run picks chat files up; a chat can also start a run itself
# (chats/README.md on the status branch says how).
name: status board

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, closed]
  push:
    branches: [main, "brief/**"]
  workflow_run:
    workflows: [checks, night-checks, lab]
    types: [completed]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write        # the status and gh-pages branches
  issues: write          # create the two review labels
  pull-requests: read
  checks: read
  actions: read

jobs:
  build:
    name: rebuild the board
    # A pull request from a fork gets a read-only token: skip it, the hourly run covers it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: status-board   # one run at a time; never cancel one in progress
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.board.outputs.changed }}
    steps:
      # Always main's script, whatever started the run.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      # Only before Brief 021 is on main: take the script from the pull request that adds it, so it can be tried live.
      - name: Script not on main yet (Brief 021's own pull request)
        if: hashFiles('sims/status/board.js') == '' && github.event_name == 'pull_request'
        run: |
          git fetch -q origin "${{ github.event.pull_request.head.sha }}"
          git checkout -q "${{ github.event.pull_request.head.sha }}" -- sims/status
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Review labels (created once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name')
          echo "$have" | grep -qx "review: merge" || gh label create "review: merge" --repo "$GITHUB_REPOSITORY" --color 2da44e --description "Design chat review: ready to merge"
          echo "$have" | grep -qx "review: hold" || gh label create "review: hold" --repo "$GITHUB_REPOSITORY" --color d29922 --description "Design chat review: hold"
      - name: Build the board
        id: board
        env:
          GH_TOKEN: ${{ github.token }}
          # A run started by hand or by the page's Refresh button always publishes, so the "Updated" time moves (Brief 023).
          STATUS_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node sims/status/board.js status-out > result.txt
          cat result.txt >> "$GITHUB_OUTPUT"
          { echo '```'; cat status-out/BOARD.md; echo '```'; cat result.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to the status branch (only if the board changed)
        env:
          CHANGED: ${{ steps.board.outputs.changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin status > /dev/null; then
            # First run: create the branch with the chat log's README.
            git worktree add --orphan -b status st
            mkdir -p st/chats && cp sims/status/chats-README.md st/chats/README.md
            cp status-out/BOARD.md status-out/board.json st/
            (cd st && git add -A && git commit -q -m "Status board: start the status branch" && git push -q origin status)
            exit 0
          fi
          [ "$CHANGED" = true ] || { echo "Nothing changed on the board."; exit 0; }
          # A chat may push its log file meanwhile: start again from the newest status branch, up to 4 times.
          for i in 1 2 3 4; do
            git fetch -q origin status
            rm -rf st; git worktree prune
            git worktree add -q --detach st FETCH_HEAD
            cp status-out/BOARD.md status-out/board.json st/
            cd st
            git add BOARD.md board.json
            if git diff --cached --quiet; then echo "Nothing changed on the board."; exit 0; fi
            git commit -q -m "Status board: $(head -1 BOARD.md | sed 's/^STATUS · //')"
            if git push -q origin HEAD:status; then exit 0; fi
            cd ..; sleep $((i * 5))
          done
          echo "Could not push the status branch."; exit 1
      - uses: actions/upload-artifact@v4
        if: steps.board.outputs.changed == 'true'
        with:
          name: status-page
          path: |
            status-out/index.html
            status-out/board.json
          retention-days: 1

  publish:
    name: publish the status page
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own group (Brief 023, F021-2): it no longer shares play-links' group, so it can never make GitHub cancel a
    # waiting play-link publish. It touches only status/ on gh-pages, and its push retries on rejection.
    concurrency:
      group: status-page
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: status-page
          path: page
      - name: Copy the page to gh-pages under status/ (retry on rejection, up to 5 times)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          # play-links pushes without a retry: wait while one is running (up to 2 minutes), so this push doesn't land
          # between its fetch and its push and get its update rejected.
          wait_play_links() {
            for _ in $(seq 1 24); do
              busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow play-links.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
              [ "$busy" = "0" ] && return 0
              sleep 5
            done
          }
          for i in 1 2 3 4 5; do
            rm -rf site && git init -q site && cd site
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "$REPO_URL"
            # Start from the newest gh-pages each time and change only status/: nothing else is ever overwritten.
            if git fetch -q --depth 1 origin gh-pages; then git checkout -q -B gh-pages FETCH_HEAD; else git checkout -q --orphan gh-pages; touch .nojekyll; fi
            rm -rf status && mkdir -p status && cp ../page/index.html ../page/board.json status/
            git add -A status .nojekyll 2>/dev/null || git add -A status
            if git diff --cached --quiet; then echo "Nothing changed on gh-pages."; exit 0; fi
            git commit -q -m "Publish the status page"
            wait_play_links
            if git push -q origin gh-pages; then echo "Published (attempt $i)."; exit 0; fi
            cd ..; sleep $((i * 5))
          done
          echo "Could not publish the status page after 5 tries."; exit 1
