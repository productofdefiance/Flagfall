# Play links (Brief 003): publishes the board to the gh-pages branch, which GitHub Pages serves for free.
# - main:            https://productofdefiance.github.io/Flagfall/          (every push to main)
# - a pull request:  https://productofdefiance.github.io/Flagfall/pr/<number>/  (every push to it; removed when it closes)
# Only the board's files are published, not its tests. Each pull request description gets "Play this build: <link>"
# as its last line. Pages has to be switched on once: Settings → Pages → Deploy from a branch → gh-pages / root.
name: play-links

# Brief 027: a results-only pull request (head branch lab/**, the lab's delivery) has no game change, so it gets no
# play link: the job is skipped by a branch condition (GitHub's pull_request branch filter only matches the target
# branch, so it can't be done in `on:`). For the same reason main is only republished when a push to it changes board/
# (a merged results pull request changes only results/ and studies/).
# Brief 031: the published board is stamped with the counted version (tools/stamp-version.js): main's number at the
# root, "<main's version>+NNN" on a preview. main also republishes when a releases/ file is added (a new version with no
# board change), and the site gets the assembled changelog (changelog.html, changelog.md) with the version table.
on:
  push:
    branches: [main]
    paths: ["board/**", "releases/**", "changelog/**"]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write        # push the gh-pages branch
  pull-requests: write   # add the play link to the description

jobs:
  publish:
    name: publish play link
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'lab/')
    # On the job, not the workflow (Brief 027): a skipped results run must never join the queue and cancel a build's
    # waiting publish (GitHub keeps only one waiting run per group).
    concurrency:
      group: play-links    # one publish at a time, in order, so two pushes never overwrite each other
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://productofdefiance.github.io/Flagfall
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Stamp the version (Brief 031)
        if: github.event.action != 'closed'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then node tools/stamp-version.js; else node tools/stamp-version.js --pr --pr-number "$PR"; fi
          echo "Board version: $(node -p 'require("./board/version.js").game')" >> "$GITHUB_STEP_SUMMARY"
      - name: Open the gh-pages branch (create it the first time)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages && git worktree add site FETCH_HEAD && (cd site && git checkout -B gh-pages)
          else
            git worktree add --orphan -b gh-pages site
          fi
          touch site/.nojekyll
      - name: Copy the board
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # main lives at the root; keep the pull request previews under pr/ and the status page under status/ (Brief 021)
            rsync -a --delete --exclude 'tests/' --exclude 'pr/' --exclude 'status/' --exclude '.nojekyll' --exclude '.git' --exclude 'changelog.html' --exclude 'changelog.md' board/ site/
            # The assembled changelog: numbered headings, newest first, and the version table (Brief 031).
            node tools/changelog.js --md site/changelog.md --html site/changelog.html
          elif [ "${{ github.event.action }}" = "closed" ]; then
            rm -rf "site/pr/$PR"
          else
            rm -rf "site/pr/$PR" && mkdir -p "site/pr/$PR"
            rsync -a --exclude 'tests/' board/ "site/pr/$PR/"
            # Mark the copy as a preview, so the Home line can't be mistaken for main.
            sed -i "s/preview: null/preview: \"PR #$PR\"/" "site/pr/$PR/version.js"
            grep -q "preview: \"PR #$PR\"" "site/pr/$PR/version.js" || { echo "Could not mark the preview in version.js"; exit 1; }
          fi
      - name: Publish
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed on gh-pages."; exit 0; fi
          git commit -q -m "Publish ${{ github.event_name == 'push' && 'main' || format('PR #{0} ({1})', github.event.pull_request.number, github.event.action) }} at ${GITHUB_SHA::7}"
          # The status page publishes to gh-pages on its own (Brief 023, F023-2): if its push lands first, take the newer
          # gh-pages and put this commit on top (it touches other folders), then push again. Up to 5 tries.
          for i in 1 2 3 4 5; do
            if git push -q origin gh-pages; then exit 0; fi
            sleep $((i * 3))
            git fetch -q origin gh-pages
            git rebase -q FETCH_HEAD || { git rebase --abort; echo "Could not put this publish on top of the newer gh-pages."; exit 1; }
          done
          echo "Could not push gh-pages after 5 tries."; exit 1
      - name: Put the play link at the end of the pull request description
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          link="$SITE/pr/$PR/"
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
          grep -v '^Play this build: ' body.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > new.md || true
          printf '\nPlay this build: %s\n' "$link" >> new.md
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --body-file new.md
          echo "Play this build: $link" >> "$GITHUB_STEP_SUMMARY"
